    <rect x="12.5" y="17" width="37" height="27" rx="3" stroke-width="2.5"/>
    <g stroke-width="2"><rect x="17" y="30" width="6.5" height="11" rx="1.5"/><rect x="27.5" y="25" width="6.5" height="16" rx="1.5"/><rect x="38" y="21" width="6.5" height="20" rx="1.5"/></g>
    <circle cx="52.2" cy="31" r="0.6" stroke-width="2"/>
  </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Báo tiến độ: máy ảnh hiện trường + mũi tên gửi lên -->
  <defs>
    <clipPath id="cam"><rect x="6" y="18" width="46" height="34" rx="7"/></clipPath>
    <clipPath id="lens"><circle cx="29" cy="35" r="11"/></clipPath>
    <clipPath id="badge"><circle cx="50" cy="48" r="10"/></clipPath>
  </defs>
  <g id="fills">
    <rect x="16" y="12" width="16" height="10" rx="3" fill="#4CC9F0"/>
    <rect x="6" y="18" width="46" height="34" rx="7" fill="#4CC9F0"/>
    <circle cx="29" cy="35" r="11" fill="#FFD166"/>
  </g>
  <g id="shadows">
    <rect x="0" y="46.5" width="64" height="8" fill="#2BA8CF" clip-path="url(#cam)"/>
    <rect x="0" y="40" width="64" height="8" fill="#E9B443" clip-path="url(#lens)"/>
  </g>
  <g id="details">
    <circle cx="29" cy="35" r="6.5" fill="#26264A"/>
    <rect x="40" y="23" width="7" height="4.5" rx="2" fill="#EF476F"/>
  </g>
  <g id="strokes" stroke="#1E1E24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 18.5V15Q16 12 19 12H29Q32 12 32 15V18.5"/>
    <rect x="6" y="18" width="46" height="34" rx="7"/>
    <circle cx="29" cy="35" r="11"/>
    <circle cx="29" cy="35" r="6.5" stroke-width="2"/>
    <rect x="40" y="23" width="7" height="4.5" rx="2" stroke-width="2"/>
  </g>
  <g id="highlights" fill="#FFFFFF">
    <rect x="9.5" y="21.5" width="7" height="2.2" rx="1.1"/>
    <rect x="19" y="14.5" width="5" height="1.8" rx="0.9"/>
    <circle cx="26.3" cy="32.3" r="1.8"/>
    <circle cx="31" cy="37.5" r="0.9"/>
  </g>
  <g id="badge">
    <circle cx="50" cy="48" r="10" fill="#06D6A0"/>
    <rect x="36" y="52" width="28" height="10" fill="#05B386" clip-path="url(#badge)"/>
    <path d="M43.8 45.4Q44.8 42.4 47.6 41.2" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <g stroke="#1E1E24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

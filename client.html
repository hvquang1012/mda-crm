<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B0812F">
<title>Tiến độ thi công — MD Architects</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase-js@2.45.4.min.js"></script>
<script src="config.js"></script>
</head>
<body>
<div id="app">

  <div id="clientError" class="screen active" style="align-items:center;justify-content:center;padding:32px;text-align:center;">
    <div class="login-mark">M</div>
    <div class="login-title">Không mở được</div>
    <div class="login-sub" id="clientErrorMsg">Đang kiểm tra link...</div>
  </div>

  <div id="clientMain" class="screen">
    <div class="app-header">
      <div class="header-left">
        <div class="header-mark">M</div>
        <div><div class="header-title" id="clientProjectName">—</div>
          <div class="header-sub" id="clientProjectAddr"></div></div>
      </div>
      <span class="online-dot" id="clientOnlineDot"></span>
    </div>
    <div class="stats-strip" id="clientStats"></div>
    <div class="list-wrap" style="padding-bottom:16px;">
      <div class="section-label">Các giai đoạn thi công</div>
      <div id="clientStageList"></div>
    </div>
    <div class="section-label" style="padding:0 18px;">Hình ảnh công trình</div>
    <div class="client-photo-album" id="clientPhotoAlbum"></div>
  </div>

</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg"></div>

<script type="module" src="js/client.js"></script>
</body>
</html>

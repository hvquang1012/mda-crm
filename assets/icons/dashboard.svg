    <rect x="15.5" y="19.8" width="7" height="2" rx="1"/>
  </g>
  <g id="accents">
    <path d="M57 2.5Q57 7 61.5 7Q57 7 57 11.5Q57 7 52.5 7Q57 7 57 2.5Z" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="4" cy="57" r="1.8" fill="#1E1E24"/>
    <circle cx="60" cy="56" r="1.4" fill="#1E1E24"/>

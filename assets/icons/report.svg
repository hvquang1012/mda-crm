      <path d="M50 53V43.5M45.8 47.4L50 43.2L54.2 47.4"/>
    </g>
  </g>
  <g id="accents">
    <path d="M55 4.5Q55 9 59.5 9Q55 9 55 13.5Q55 9 50.5 9Q55 9 55 4.5Z" fill="#1E1E24" stroke="#1E1E24" stroke-width="1.2" stroke-linejoin="round"/>
    <circle cx="6" cy="9" r="1.8" fill="#1E1E24"/>
    <circle cx="44" cy="12" r="1.3" fill="#1E1E24"/>
  </g>

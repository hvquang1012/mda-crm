<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4338CA">
<meta name="color-scheme" content="light dark">
<title>Tiến độ thi công — Minh Đức</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>try{var s=localStorage,d=document.documentElement,t=s.getItem('mda-theme'),f=s.getItem('mda-font'),l=s.getItem('mda-lang');if(t==='light'||t==='dark')d.dataset.theme=t;if(f==='sm'||f==='lg')d.dataset.font=f;if(l==='en')d.lang='en'}catch(e){}</script>
<link rel="stylesheet" href="css/app.css">
<script src="vendor/supabase-js@2.45.4.min.js"></script>
<script src="config.js"></script>
</head>
<body class="client-app">
<div id="app">

  <div id="clientError" class="screen active" style="align-items:center;justify-content:center;padding:32px;text-align:center;">
    <img class="login-logo compact" src="assets/logo-minh-duc.png" alt="Minh Đức">
    <div class="login-title">Không mở được</div>
    <div class="login-sub" id="clientErrorMsg">Đang kiểm tra link...</div>
  </div>

  <div id="clientMain" class="screen">
    <div class="app-header">
      <div class="header-left">
        <img class="header-logo" src="assets/logo-minh-duc.png" alt="Minh Đức">
        <div><div class="header-title" id="clientProjectName">—</div>
          <div class="header-sub" id="clientProjectAddr"></div></div>
      </div>
      <div class="header-right"><span id="quickSettings"></span><span class="online-dot" id="clientOnlineDot"></span></div>
    </div>
    <div class="client-scroll">
      <div class="stats-strip" id="clientStats"></div>
      <div class="client-workspace">
        <section class="client-panel">
          <div class="section-label" data-i18n="client.stages">Các giai đoạn thi công</div>
          <div id="clientStageList"></div>
        </section>
        <section class="client-panel client-gallery-panel">
          <div class="section-label">Hình ảnh công trình</div>
          <div class="client-photo-album" id="clientPhotoAlbum"></div>
        </section>
      </div>
    </div>
  </div>

</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg"></div>

<script type="module" src="js/client.js"></script>
</body>
</html>
